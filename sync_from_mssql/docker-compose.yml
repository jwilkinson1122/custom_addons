version: "3.8"

services:
  odoo:
    image: odoo:17
    container_name: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
    environment:
      # - HOST=db
      - HOST=odoo-db
      - ODOO_DB=odoo
      - USER=odoo # ✅ Odoo database user (matches POSTGRES_USER)
      - PASSWORD=myodoo_password # ✅ Odoo database password (matches POSTGRES_PASSWORD)
  db:
    # image: postgres:15
    image: postgres:17
    container_name: odoo-db
    restart: always
    environment:
      POSTGRES_DB: pod_test # ✅ Name of the Odoo database
      POSTGRES_USER: odoo # ✅ PostgreSQL user
      POSTGRES_PASSWORD: myodoo_password # ✅ Set a secure password
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "MyStrongMSSQLPass!" # ✅ MSSQL system admin password
      ACCEPT_EULA: "Y"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "MyStrongMSSQLPass!" ,
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  sync_script:
    build: ./sync_script
    container_name: sync_script
    depends_on:
      - odoo
      - mssql
    volumes:
      - ./data:/app/data
    environment:
      # MSSQL_SERVER: "localhost"
      MSSQL_SERVER: "mssql" # ✅ Name of the MSSQL service (Docker networking)
      MSSQL_DATABASE: "my_mssql_db" # ✅ Name of your database inside MSSQL
      MSSQL_USER: "sa" # ✅ Use "sa" for MSSQL system admin
      MSSQL_PASSWORD: "MyStrongMSSQLPass!" # ✅ Must match the SA_PASSWORD above
      ODOO_URL: "http://odoo:8069"
      ODOO_DB: "odoo" # ✅ Odoo database name
      ODOO_USER: "admin" # ✅ Odoo login user
      ODOO_PASSWORD: "admin" # ✅ Odoo login password
    command: ["/bin/bash", "-c", "cron && tail -f /var/log/cron.log"]

volumes:
  odoo-db-data:
